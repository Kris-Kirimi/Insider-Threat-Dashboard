name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insider-backend
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-real
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: insider-backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test --verbosity 2

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insider-threat-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: insider-threat-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
