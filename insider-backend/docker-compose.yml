# Local orchestration: web + Redis + Celery worker/beat + Flower.
# Secrets come from insider-backend/.env (never baked into the image).

x-backend: &backend
  build: .
  env_file:
    - .env
  environment:
    - REDIS_URL=redis://redis:6379/0
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/1
  volumes:
    - ./:/insider-backend
  depends_on:
    - redis

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  web:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  celery:
    <<: *backend
    command: celery -A insiderbackend worker --loglevel=info
    depends_on:
      - redis
      - web

  celery-beat:
    <<: *backend
    command: celery -A insiderbackend beat --loglevel=info
    depends_on:
      - redis
      - web

  flower:
    <<: *backend
    command: celery -A insiderbackend flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - web

volumes:
  redis-data:
